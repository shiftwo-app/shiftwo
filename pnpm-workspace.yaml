allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: false

overrides:
  # Vite+ の推奨どおり、ほかの部品が要求する vite も Vite+ の vite（vite-plus-core）にそろえる
  vite@*: "catalog:"

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
